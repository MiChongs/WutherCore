version: 1
profile: desktop

resolver:
  mode: smart
  fake: off
  ipv6: true
  listen: 127.0.0.1:1053

  # server 固定一个 DNS endpoint；exits 是访问该服务的代理节点数组。
  # proxy-hk / proxy-sg 应替换为 nodes 或订阅中真实存在的节点名。
  servers:
    cloudflare:
      endpoint: https://1.1.1.1/dns-query
      exits: [proxy-hk, proxy-sg, DIRECT]
      strategy: adaptive
      timeout: 3s

    google:
      endpoint: tls://8.8.8.8
      exits: [proxy-hk, proxy-sg]
      strategy: round-robin
      timeout: 3s

    ali: https://223.5.5.5/dns-query

  # group 负责不同 DNS 服务之间的冗余，也可以继续嵌套。
  groups:
    domestic: [ali, udp://119.29.29.29]
    public:
      members: [cloudflare, google]
      strategy: parallel
      max-parallel: 2
      timeout: 4s

  nameserver: [public]
  fallback: [domestic]

  rules:
    # 未写 strategy 时继承 public 的 parallel。
    - { suffix: openai.com, route: public }
    # 单次查询覆盖 group 策略。
    - { suffix: example.com, route: public, strategy: round-robin }
