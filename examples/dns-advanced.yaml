version: 1
profile: desktop

resolver:
  mode: smart
  fake: off
  ipv6: true
  listen: 127.0.0.1:1053

  # server 可以是单个字符串，也可以是包含多个 DNS 出口的高级对象。
  servers:
    cloudflare:
      endpoints:
        - https://1.1.1.1/dns-query
        - https://1.0.0.1/dns-query
        - tls://1.1.1.1
      strategy: adaptive
      timeout: 3s
      max-parallel: 1

    google:
      endpoints:
        - https://8.8.8.8/dns-query
        - tls://8.8.4.4
      strategy: random
      timeout: 3s

    ali: https://223.5.5.5/dns-query

  # group 可嵌套；短列表默认使用 adaptive。
  groups:
    domestic: [ali, udp://119.29.29.29]
    public:
      members: [cloudflare, google]
      strategy: parallel
      max-parallel: 2
      timeout: 4s

  nameserver: [public]
  fallback: [domestic]

  rules:
    # 未写 strategy 时继承 public 的 parallel。
    - { suffix: openai.com, route: public }
    # 单次查询覆盖 group 策略。
    - { suffix: example.com, route: public, strategy: round-robin }
