[workspace]
resolver = "2"
members = [
    "crates/core-config",
    "crates/core-fetch",
    "crates/core-runtime",
    "crates/core-inbound",
    "crates/core-outbound",
    "crates/core-grpc",
    "crates/core-feeds",
    "crates/core-store",
    "crates/core-ruleset",
    "crates/core-route",
    "crates/core-resolver",
    "crates/core-smart",
    "crates/core-api",
    "crates/core-capture",
    "crates/core-mesh",
    "crates/core-observe",
    "crates/core-process",
    "crates/core-reality",
    "crates/core-young",
    "crates/wuther-core",
    "tests-e2e",
]
exclude = [
    "third_party/h3-c38a1af/h3",
    "third_party/nss-rs-b7cfa30",
    "third_party/shaped-rustls-94f088e",
]

[workspace.package]
version = "0.3.6"
edition = "2024"
rust-version = "1.88"
license = "MIT"
authors = ["WutherCore Contributors"]
repository = "https://github.com/MiChongs/WutherCore"

[workspace.dependencies]
# 异步运行时
tokio = { version = "1.53.1", features = ["full"] }
tokio-util = { version = "0.7", features = ["full"] }
futures = "0.3"
async-trait = "0.1"
pin-project-lite = "0.2"
command-group = { version = "5.0.1", features = ["with-tokio"] }

# 序列化与配置
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
humantime-serde = "1"
age = { version = "=0.11.5", default-features = false, features = ["armor"] }
age-core = "=0.11.0"
bech32 = "0.12.0"
hpke = { version = "0.14.0", default-features = false, features = ["alloc", "chacha", "mlkem", "x25519"] }

# 错误与日志
anyhow = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "json"] }
tracing-appender = "0.2"

# 网络通用
bytes = "1"
url = "2"
ipnet = { version = "2", features = ["serde"] }
hickory-resolver = { version = "0.26", default-features = false, features = ["tokio", "tls-ring", "https-ring", "system-config"] }
hickory-proto = "0.26"

# Hash / 集合 / 内存优化
ahash = "0.8"
dashmap = "6"
# Turso 的全异步连接需要 parking_lot 的 send_guard。该特性与
# deadlock_detection 在上游互斥，锁卡顿由独立 watchdog 的心跳和栈采样诊断。
parking_lot = "0.12"
# 卡死时拿当前所有线程的栈，写进 panic.log 给运行人员排障。
backtrace = "0.3"
# 短字符串内联（≤24 字节不分配堆），活跃连接的 metadata 字段几乎全部命中。
compact_str = { version = "0.10", features = ["serde"] }
# 小向量内联（typical chains 长度 1-4），避免 chains/geoip 触发堆分配。
smallvec = { version = "1", features = ["serde", "union", "const_generics", "const_new"] }
# Arc 原子换页，给"连接表写入低频、快照读取高频"的场景做无锁切换。
arc-swap = "1"
# DOMAIN-KEYWORD 多模式自动机：一次扫描域名即可得到全部关键字命中，
# 避免按规则逐条重复执行子串搜索。
aho-corasick = "1"
# Mihomo DOMAIN-WILDCARD / PROCESS-*-WILDCARD are compiled once into a
# multi-pattern automaton instead of running an ad-hoc wildcard loop per flow.
globset = "0.4"
# Patricia/tree-bitmap prefix table for large classical CIDR providers.
ip_network_table = "0.2"
ip_network = "0.4"
# UTS #46/IDNA normalization keeps Unicode configuration and punycode DNS
# answers in one canonical comparison space.
idna = "1"
# 无锁 MPMC 队列用于把活跃流量会话和脏统计行送入后台批量持久化，
# 避免每个数据块写数据库状态，也避免定时任务扫描全部历史分类。
crossbeam-queue = "0.3"
# O(1) sticky-session 淘汰，避免旧实现容量满时每次 O(n) 扫描最老项。
lru = "0.16"
# Mozilla Public Suffix List 的无分配静态实现，用于真实 registrable domain。
psl = "2"
# 策略组依赖图：编译期拓扑校验与精确循环路径诊断。
petgraph = "0.8.3"
# 成员集合必须稳定保序，避免 provider 刷新后面板选项随机跳动。
indexmap = "2.14.0"

# CLI
clap = { version = "4", features = ["derive"] }
comfy-table = "7.2.2"
unicode-width = "0.2"

# Web / API
axum = { version = "0.8", features = ["ws", "macros"] }
tower = "0.5"
tower-http = { version = "0.7", features = ["cors", "trace"] }
# 自研 core-fetch 用的 HTTP 1.1 client 栈 —— 直接走 hyper 1.x，注入
# bind_outbound_socket，关掉所有平台（含 Windows）订阅 / 规则集拉取的 TUN
# 自循环。已经替代 reqwest，依赖也跟着移除。
hyper            = { version = "1", features = ["client", "http1", "http2"] }
hyper-util       = { version = "0.1", features = ["client", "client-legacy", "tokio"] }
http             = "1"
http-body-util   = "0.1"
prost            = "=0.14.4"
tonic            = { version = "=0.14.6", default-features = false }
tonic-prost      = "=0.14.6"
tokio-stream     = { version = "=0.1.19", features = ["sync"] }
flate2           = "1"
brotli           = "8"
turso = { version = "0.7.1", default-features = false }
# 加密 / TLS / WS / 协议层
aes-gcm           = "0.11"
chacha20poly1305  = "0.11"
hkdf              = "0.13"
sha2              = "0.11"
hmac              = "0.13"
md-5              = "0.11"
blake3            = "1"
rustls            = { version = "=0.23.42", default-features = false, features = ["aws_lc_rs", "brotli", "ring", "std", "tls12"] }
tokio-rustls      = { version = "0.26.4", default-features = false, features = ["aws_lc_rs", "logging", "ring", "tls12"] }
rustls-pki-types  = "1"
webpki-roots      = "1.0"
rustls-native-certs = "0.8.4"
boring            = { version = "=5.1.0" }
boring-sys        = { version = "=5.1.0" }
tokio-boring      = { version = "=5.0.0" }
tokio-tungstenite = { version = "0.30", default-features = false, features = ["connect"] }
uuid              = { version = "1", features = ["v4"] }
aes               = "0.9"
ctr               = "0.10"
cfb-mode          = "0.9"
crc32fast         = "1"
fnv               = "1"
zeroize           = "1"
sha3              = "0.12"
shake             = "0.1"
sha1              = "0.11"
rc4               = "0.2"
chacha20          = "0.10"
cronet            = "0.2.0"
shadowsocks       = { version = "=1.24.0", default-features = false, features = ["aead-cipher", "aead-cipher-extra", "aead-cipher-2022", "aead-cipher-2022-extra", "stream-cipher", "security-replay-attack-detect"] }
# AnyTLS 官方目前只发布 Go 参考实现；Rust 侧固定复用已审计的协议 core
# （命令、帧与 padding scheme 解析），连接池/状态机在 core-outbound 中按
# sing-anytls v0.0.13 实现，避免依赖其 runtime 的语义差异。
anytls           = { version = "=0.3.10", default-features = false, features = ["core"] }

# QUIC + UDP 协议（Hysteria / TUIC）
quinn             = { version = "0.11", default-features = false, features = ["rustls", "ring", "runtime-tokio"] }
quinn-proto       = { version = "0.11", default-features = false, features = ["rustls", "ring"] }
h3                = { git = "https://github.com/hyperium/h3", rev = "c38a1af632afbbbc8f6716c196ad67f40bc122e3" }
h3-quinn          = { git = "https://github.com/hyperium/h3", rev = "c38a1af632afbbbc8f6716c196ad67f40bc122e3" }

# SSH 客户端
russh             = "0.62"

# WireGuard 用户态
boringtun         = { version = "=0.7.1", default-features = false }
x25519-dalek      = { version = "=3.0.0", features = ["static_secrets"] }

# 工具
once_cell = "1"
regex = "1"
fancy-regex = "0.18"
percent-encoding = "2"
base64 = "0.23"
num-bigint = "0.4"
rand = "0.10"
rand_chacha = "0.10"
hex = "0.4"
tempfile = "3"
libc = "0.2"
caps = "0.5.6"
route_manager = "0.2.12"
rtnetlink = "0.21.0"

# 内部 crate
core-config   = { path = "crates/core-config" }
core-fetch    = { path = "crates/core-fetch" }
core-runtime  = { path = "crates/core-runtime" }
core-inbound  = { path = "crates/core-inbound", default-features = false }
core-outbound = { path = "crates/core-outbound", default-features = false }
core-grpc     = { path = "crates/core-grpc" }
core-feeds    = { path = "crates/core-feeds" }
core-store    = { path = "crates/core-store" }
core-ruleset  = { path = "crates/core-ruleset" }
core-route    = { path = "crates/core-route" }
core-resolver = { path = "crates/core-resolver" }
core-smart    = { path = "crates/core-smart" }
core-api      = { path = "crates/core-api", default-features = false }
core-capture  = { path = "crates/core-capture" }
core-mesh     = { path = "crates/core-mesh" }
core-observe  = { path = "crates/core-observe" }
core-process  = { path = "crates/core-process" }
core-reality  = { path = "crates/core-reality" }
core-young    = { path = "crates/core-young", default-features = false }
neqo-common   = { git = "https://github.com/mozilla/neqo", rev = "76673b127251c90ad6250de7a0a7400ddd4661f1" }
neqo-http3    = { git = "https://github.com/mozilla/neqo", rev = "76673b127251c90ad6250de7a0a7400ddd4661f1" }
neqo-transport = { git = "https://github.com/mozilla/neqo", rev = "76673b127251c90ad6250de7a0a7400ddd4661f1" }
nss           = { package = "nss-rs", git = "https://github.com/mozilla/nss-rs" }
xray-routing  = { git = "https://github.com/aimalygin/xray-rust.git", rev = "bb3e00da1abfc5fff70487b0dd2ba16054797584", package = "xray-routing" }
xray-transport = { path = "third_party/xray-transport" }
xray-utls     = { git = "https://github.com/aimalygin/xray-rust.git", rev = "bb3e00da1abfc5fff70487b0dd2ba16054797584", package = "xray-utls" }

[patch.crates-io]
# REALITY 必须在同一个真实 ClientHello 上完成 session-id 封装并继续握手；
# XHTTP 的 uTLS/ECH 也依赖精确扩展塑形。上游 rustls 没有这些 finalizer/
# customizer hook，因此固定使用经过审阅的同 revision 本地源码。
rustls = { path = "third_party/shaped-rustls-94f088e/rustls" }

[patch."https://github.com/mozilla/nss-rs"]
# Android 上唯一可用的 NSS 交叉构建（mozilla/application-services 的
# build-nss-android.sh，Firefox for Android 同款）只产出静态库，而上游 nss-rs
# 仅在 PROFILE=debug / Windows / fuzzing 时选择静态链接。release 构建会去链
# libnss3、libssl3、libnssutil3 这些从不生成的共享库，导致 with_young 在
# Android 上必然链接失败。本地副本按 target_os 而非 profile 判定，其余与
# b7cfa30 逐字节一致。
nss-rs = { path = "third_party/nss-rs-b7cfa30" }

[patch."https://github.com/hyperium/h3"]
# c38a1af 的 h3 会把合法的零长度 DATA 帧误报成消息 EOF。XHTTP/3
# 服务端需要用这种无业务负载的帧探测对端 STOP_SENDING，因此固定使用带
# 最小修复的同版本源码；h3-quinn 仍来自同一个上游提交并解析到此 h3。
h3 = { path = "third_party/h3-c38a1af/h3" }

# ============================================================================
# 编译时间 / 二进制大小 / 运行性能的权衡
# ============================================================================
# 设计目标：把 LLVM 后端的"惊喜成本"降到最低。
# * dev：incremental + codegen-units=256 + line-tables-only + 依赖 opt-level=1
#        —— 第二次以后增量编译几乎只有改动 crate 的耗时；
# * release：thin LTO + codegen-units=16，二进制大小几乎不变，
#            构建时间从 codegen-units=1 的 ~3min 降到 ~1min；
# * release-fast：完全关 LTO，仅 strip + opt-level=3，CI 快速验证用。
# ============================================================================

[profile.dev]
opt-level = 0
incremental = true
codegen-units = 256
# line-tables-only 比 "full" 小一个量级，错误信息仍带行号；
# 显著降低链接器扫描 .pdb / .dwarf 的时间。
debug = "line-tables-only"
# Windows 上单独 .pdb，避免每次链接重写主二进制。
split-debuginfo = "unpacked"

# 关键：把第三方依赖编成 opt-level=1。
# rustc 编译 deps 一次后落进 incremental cache；之后每次只重链。
# 用户代码继续 opt-level=0 保持 hot-edit 极快。
[profile.dev.package."*"]
opt-level = 1
codegen-units = 16
debug = false

[profile.release]
opt-level = 3
lto = "thin"
# 16 个 codegen-units 配合 thin LTO ≈ codegen-units=1 + fat LTO 的 99%
# 性能水平，但构建时间下降 60%。
codegen-units = 16
panic = "abort"
strip = "symbols"
debug = false
incremental = false

[profile.release-fast]
inherits = "release"
lto = "off"
codegen-units = 256
debug = false
incremental = true

[profile.bench]
inherits = "release"
debug = true
