[workspace]

[features]
default = []
# Android vendor kernels commonly expose BPF_PROG_TYPE_SK_LOOKUP without the
# Linux 5.17 ingress_ifindex context extension. The Android object therefore
# uses the mark-gated loopback TC socket assignment backend exclusively.
android-compat = []

[package]
name = "core-inbound-ebpf"
version = "0.3.8"
edition = "2024"
license = "MIT"

[dependencies]
aya-ebpf = { version = "0.2.1", default-features = false }

[build-dependencies]
which = "8"

[[bin]]
name = "core-inbound-ebpf"
path = "src/main.rs"

[profile.release]
debug = 2
codegen-units = 1
strip = false
lto = "off"
