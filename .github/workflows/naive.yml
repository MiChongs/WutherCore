name: Naive CI

on:
  pull_request:
    branches: ["main"]
    paths:
      - ".github/actions/**"
      - ".github/workflows/naive.yml"
      - "Cargo.lock"
      - "Cargo.toml"
      - "crates/core-config/**"
      - "crates/core-feeds/**"
      - "crates/core-outbound/**"
      - "crates/wuther-core/**"
  push:
    branches: ["main"]
    paths:
      - ".github/actions/**"
      - ".github/workflows/naive.yml"
      - "Cargo.lock"
      - "Cargo.toml"
      - "crates/core-config/**"
      - "crates/core-feeds/**"
      - "crates/core-outbound/**"
      - "crates/wuther-core/**"
  workflow_dispatch:
    inputs:
      tags:
        description: Extra component tags to compile together with with_naive.
        required: false
        type: string
        default: ""

permissions:
  contents: read

concurrency:
  group: naive-${{ github.event.pull_request.number || github.ref }}-${{ inputs.tags || 'naive' }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  CARGO_NET_RETRY: 10
  CARGO_REGISTRIES_CRATES_IO_PROTOCOL: sparse
  RUST_BACKTRACE: 1

jobs:
  prepare:
    name: Resolve inputs
    runs-on: ubuntu-slim
    timeout-minutes: 5
    outputs:
      tags: ${{ steps.tags.outputs.tags }}
      tag-label: ${{ steps.tags.outputs.label }}
      tag-key: ${{ steps.tags.outputs.key }}

    steps:
      - name: Validate Naive component tags
        id: tags
        shell: bash
        env:
          EXTRA_TAGS: ${{ inputs.tags }}
        run: |
          set -euo pipefail
          normalized="$(tr ' ;' ',,' <<< "$EXTRA_TAGS" | sed -E 's/,+/,/g; s/^,//; s/,$//')"
          if [ -n "$normalized" ] && [[ ! "$normalized" =~ ^[A-Za-z0-9_-]+(,[A-Za-z0-9_-]+)*$ ]]; then
            echo "::error::Component tags must be a comma/space-separated list of Cargo feature names."
            exit 1
          fi

          tags="with_naive${normalized:+,$normalized}"
          key="$(printf '%s' "$tags" | sha256sum | cut -c1-16)"
          echo "tags=$tags" >> "$GITHUB_OUTPUT"
          echo "label=$tags" >> "$GITHUB_OUTPUT"
          echo "key=$key" >> "$GITHUB_OUTPUT"

  check:
    name: Naive feature check
    needs: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup cached Rust
        uses: ./.github/actions/setup-rust
        with:
          cache-key: naive-check-${{ needs.prepare.outputs.tag-key }}
          cache-targets: false
          save-cache: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}

      - name: Setup cached Cronet SDK
        uses: ./.github/actions/setup-cronet

      - name: Check Naive feature
        shell: bash
        env:
          WUTHER_BUILD_TAGS: ${{ needs.prepare.outputs.tags }}
        run: |
          cargo check -p wuther-core --no-default-features \
            --features "$WUTHER_BUILD_TAGS" --all-targets --locked

  tests:
    needs: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        test:
          - name: URI parsing
            id: config
            cronet: false
          - name: native tunnel
            id: outbound
            cronet: true

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup cached Rust
        uses: ./.github/actions/setup-rust
        with:
          cache-key: naive-test-${{ matrix.test.id }}-${{ needs.prepare.outputs.tag-key }}
          cache-targets: false
          save-cache: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}

      - name: Setup cached Cronet SDK
        if: matrix.test.cronet
        uses: ./.github/actions/setup-cronet

      - name: Test Naive URI parsing
        if: matrix.test.id == 'config'
        run: cargo test -p core-config parse_naive_h2_and_quic_links --locked

      - name: Test Naive native tunnel
        if: matrix.test.id == 'outbound'
        run: |
          cargo test -p core-outbound --no-default-features \
            --features with_naive naive --locked

  required:
    name: Naive / Cronet
    if: always()
    needs:
      - prepare
      - check
      - tests
    runs-on: ubuntu-slim
    timeout-minutes: 5

    steps:
      - name: Verify Naive jobs
        shell: bash
        env:
          PREPARE_RESULT: ${{ needs.prepare.result }}
          CHECK_RESULT: ${{ needs.check.result }}
          TEST_RESULT: ${{ needs.tests.result }}
          TAGS: ${{ needs.prepare.outputs.tag-label }}
        run: |
          set -euo pipefail
          {
            echo "## Naive / Cronet"
            echo
            echo "- Components: \`$TAGS\`"
            echo "- Feature check: $CHECK_RESULT"
            echo "- Parallel tests: $TEST_RESULT"
          } >> "$GITHUB_STEP_SUMMARY"

          for result in "$PREPARE_RESULT" "$CHECK_RESULT" "$TEST_RESULT"; do
            if [ "$result" != "success" ]; then
              echo "::error::A required Naive job did not succeed."
              exit 1
            fi
          done
