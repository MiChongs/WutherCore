name: Naive CI

on:
  pull_request:
    branches: ["main"]
    paths:
      - ".github/workflows/naive.yml"
      - "Cargo.lock"
      - "Cargo.toml"
      - "crates/core-config/**"
      - "crates/core-feeds/**"
      - "crates/core-outbound/**"
      - "crates/wuther-core/**"
  workflow_dispatch:
    inputs:
      tags:
        description: Extra component tags to compile together with with_naive.
        required: false
        type: string
        default: ""

permissions:
  contents: read

concurrency:
  group: naive-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  RUST_BACKTRACE: 1

jobs:
  naive:
    name: Naive / Cronet
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2.9.1
        with:
          prefix-key: v1-wuther-core
          shared-key: naive
          workspaces: |
            . -> target
          cache-bin: false

      - name: Fetch verified Cronet SDK
        shell: bash
        run: |
          git clone --branch v0.2.0 --depth 1 https://github.com/MiChongs/cronet-rs.git "$RUNNER_TEMP/cronet-rs"
          "$RUNNER_TEMP/cronet-rs/scripts/fetch-native.sh" amd64 "$RUNNER_TEMP/cronet-sdk"
          echo "CRONET_LIB_DIR=$RUNNER_TEMP/cronet-sdk/lib" >> "$GITHUB_ENV"
          echo "CRONET_LIB_NAME=cronet" >> "$GITHUB_ENV"
          echo "LD_LIBRARY_PATH=$RUNNER_TEMP/cronet-sdk/lib" >> "$GITHUB_ENV"

      - name: Check Naive feature
        shell: bash
        env:
          EXTRA_TAGS: ${{ inputs.tags }}
        run: |
          set -euo pipefail
          normalized="$(tr ' ;' ',,' <<< "$EXTRA_TAGS" | sed -E 's/,+/,/g; s/^,//; s/,$//')"
          if [ -n "$normalized" ] && [[ ! "$normalized" =~ ^[A-Za-z0-9_-]+(,[A-Za-z0-9_-]+)*$ ]]; then
            echo "::error::Component tags must be a comma/space-separated list of Cargo feature names."
            exit 1
          fi
          tags="with_naive${normalized:+,$normalized}"
          cargo check -p wuther-core --no-default-features --features "$tags" --all-targets --locked

      - name: Test Naive URI and native tunnel
        run: |
          cargo test -p core-config parse_naive_h2_and_quic_links --locked
          cargo test -p core-outbound --no-default-features --features with_naive naive --locked
