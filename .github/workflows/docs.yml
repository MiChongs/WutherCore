name: Documentation

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/docs.yml"
      - "docs/**"
      - "mkdocs.yml"
      - "requirements-docs.txt"
      - "scripts/config-reference.py"
      - "scripts/check-repository.py"
      - "scripts/README.md"
      - "crates/core-config/src/model.rs"
      - "crates/core-config/src/stream_settings.rs"
      - "CHANGELOG.md"
      - "CODE_OF_CONDUCT.md"
      - "CONTRIBUTING.md"
      - "GOVERNANCE.md"
      - "ROADMAP.md"
      - "SECURITY.md"
      - "SUPPORT.md"
  pull_request:
    paths:
      - ".github/workflows/docs.yml"
      - "docs/**"
      - "mkdocs.yml"
      - "requirements-docs.txt"
      - "scripts/config-reference.py"
      - "scripts/check-repository.py"
      - "scripts/README.md"
      - "crates/core-config/src/model.rs"
      - "crates/core-config/src/stream_settings.rs"
      - "CHANGELOG.md"
      - "CODE_OF_CONDUCT.md"
      - "CONTRIBUTING.md"
      - "GOVERNANCE.md"
      - "ROADMAP.md"
      - "SECURITY.md"
      - "SUPPORT.md"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build MkDocs site
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup cached Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-docs.txt

      - name: Install documentation dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-docs.txt

      - name: Verify configuration reference coverage
        run: python scripts/config-reference.py --check

      - name: Check repository presentation
        run: python scripts/check-repository.py

      - name: Configure GitHub Pages
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@v6

      - name: Build strict site
        run: mkdocs build --strict --clean

      - name: Verify generated site
        shell: bash
        run: |
          set -euo pipefail
          test -s site/index.html
          test -s site/404.html
          test -s site/search/search_index.json
          test "$(find site -name index.html -type f | wc -l)" -ge 30
          ! grep -R -E 'href="(file:|[A-Za-z]:\\\\)' site

      - name: Upload GitHub Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v5
        with:
          path: site

      - name: Publish build summary
        if: always()
        shell: bash
        run: |
          {
            echo "## MkDocs"
            echo
            echo "- Event: \`${{ github.event_name }}\`"
            echo "- Commit: \`${GITHUB_SHA:0:12}\`"
            if [ -d site ]; then
              echo "- HTML pages: $(find site -name '*.html' -type f | wc -l)"
              echo "- Site size: $(du -sh site | cut -f1)"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  deploy:
    name: Deploy GitHub Pages
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
