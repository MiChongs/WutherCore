name: CI

on:
  workflow_call:
    inputs:
      ref:
        description: Git ref to validate; defaults to the triggering ref.
        required: false
        type: string
        default: ""
      tags:
        description: Exact component tags; empty validates the standard workspace.
        required: false
        type: string
        default: ""
      validate-macos:
        description: Build and smoke-test macOS on Apple Silicon.
        required: false
        type: boolean
        default: true
  pull_request:
    branches: ["main"]
  push:
    branches: ["main"]
  workflow_dispatch:
    inputs:
      tags:
        description: Exact component tags, for example with_quic,with_vless,with_grpc. Empty uses standard.
        required: false
        type: string
        default: ""
      validate-macos:
        description: Build and smoke-test Apple Silicon.
        required: true
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ inputs.ref || github.event.pull_request.number || github.ref }}-${{ inputs.tags || 'standard' }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  CARGO_NET_RETRY: 10
  CARGO_REGISTRIES_CRATES_IO_PROTOCOL: sparse
  RUST_BACKTRACE: 1

jobs:
  prepare:
    name: Resolve inputs
    runs-on: ubuntu-slim
    timeout-minutes: 5
    outputs:
      tags: ${{ steps.tags.outputs.tags }}
      tag-label: ${{ steps.tags.outputs.label }}
      tag-key: ${{ steps.tags.outputs.key }}

    steps:
      - name: Validate component tags
        id: tags
        shell: bash
        env:
          REQUESTED_TAGS: ${{ inputs.tags }}
        run: |
          set -euo pipefail
          normalized="$(tr ' ;' ',,' <<< "$REQUESTED_TAGS" | sed -E 's/,+/,/g; s/^,//; s/,$//')"
          if [ -n "$normalized" ] && [[ ! "$normalized" =~ ^[A-Za-z0-9_-]+(,[A-Za-z0-9_-]+)*$ ]]; then
            echo "::error::Component tags must be a comma/space-separated list of Cargo feature names."
            exit 1
          fi

          label="${normalized:-standard (default)}"
          key="standard"
          if [ -n "$normalized" ]; then
            key="$(printf '%s' "$normalized" | sha256sum | cut -c1-16)"
          fi

          echo "tags=$normalized" >> "$GITHUB_OUTPUT"
          echo "label=$label" >> "$GITHUB_OUTPUT"
          echo "key=$key" >> "$GITHUB_OUTPUT"
          {
            echo "## CI configuration"
            echo
            echo "- Components: \`$label\`"
            echo "- Ref: \`${GITHUB_REF_NAME:-requested ref}\`"
          } >> "$GITHUB_STEP_SUMMARY"

  quality:
    name: Formatting and repository checks
    needs: prepare
    runs-on: ubuntu-slim
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.ref }}
          persist-credentials: false

      - name: Check repository presentation
        run: python scripts/check-repository.py

      - name: Verify configuration reference coverage
        run: python scripts/config-reference.py --check

      - name: Install rustfmt
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          components: rustfmt

      - name: Check formatting
        shell: bash
        run: |
          cargo fmt --all --check
          cargo fmt --manifest-path crates/core-inbound/ebpf/Cargo.toml -- --check

  linux:
    name: Linux workspace
    needs: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.ref }}
          persist-credentials: false

      - name: Ensure Firefox Neqo build tools
        if: >-
          needs.prepare.outputs.tags == '' ||
          contains(format(',{0},', needs.prepare.outputs.tags), ',with_young,') ||
          contains(format(',{0},', needs.prepare.outputs.tags), ',standard,') ||
          contains(format(',{0},', needs.prepare.outputs.tags), ',all_components,')
        uses: ./.github/actions/setup-neqo

      - name: Setup cached Rust
        uses: ./.github/actions/setup-rust
        with:
          cache-key: ci-linux-${{ needs.prepare.outputs.tag-key }}
          cache-targets: false
          save-cache: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}

      - name: Setup Aya eBPF build tools
        if: contains(format(',{0},', needs.prepare.outputs.tags), ',with_ebpf,')
        uses: ./.github/actions/setup-ebpf

      - name: Check workspace
        shell: bash
        env:
          WUTHER_BUILD_TAGS: ${{ needs.prepare.outputs.tags }}
        run: |
          set -euo pipefail
          if [ -n "$WUTHER_BUILD_TAGS" ]; then
            cargo check -p wuther-core --all-targets --locked \
              --no-default-features --features "$WUTHER_BUILD_TAGS"
          else
            cargo check --workspace --all-targets --locked
          fi

  macos:
    name: macOS Apple Silicon
    if: >-
      (github.event_name != 'workflow_call' || inputs.validate-macos) &&
      !contains(format(',{0},', needs.prepare.outputs.tags), ',with_ebpf,')
    needs: prepare
    runs-on: macos-15
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.ref }}
          persist-credentials: false

      - name: Setup cached Rust
        uses: ./.github/actions/setup-rust
        with:
          cache-key: ci-macos-aarch64-apple-darwin-${{ needs.prepare.outputs.tag-key }}
          targets: aarch64-apple-darwin
          cache-targets: true
          save-cache: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}

      - name: Ensure Firefox Neqo build tools
        if: >-
          needs.prepare.outputs.tags == '' ||
          contains(format(',{0},', needs.prepare.outputs.tags), ',with_young,') ||
          contains(format(',{0},', needs.prepare.outputs.tags), ',standard,') ||
          contains(format(',{0},', needs.prepare.outputs.tags), ',all_components,')
        uses: ./.github/actions/setup-neqo

      - name: Build macOS binary
        shell: bash
        env:
          TARGET: aarch64-apple-darwin
          WUTHER_BUILD_TAGS: ${{ needs.prepare.outputs.tags }}
        run: |
          set -euo pipefail
          if [ -n "$WUTHER_BUILD_TAGS" ]; then
            cargo build --profile release-fast --locked --target "$TARGET" \
              -p wuther-core --no-default-features --features "$WUTHER_BUILD_TAGS"
          else
            cargo build --profile release-fast --locked --target "$TARGET" \
              -p wuther-core
          fi

      - name: Stage macOS runtime libraries
        if: >-
          needs.prepare.outputs.tags == '' ||
          contains(format(',{0},', needs.prepare.outputs.tags), ',with_young,') ||
          contains(format(',{0},', needs.prepare.outputs.tags), ',standard,') ||
          contains(format(',{0},', needs.prepare.outputs.tags), ',all_components,')
        shell: bash
        env:
          TARGET: aarch64-apple-darwin
        run: >-
          python3 scripts/stage-runtime-libraries.py
          --target "$TARGET"
          --profile release-fast
          --require libnssutil3.dylib

      - name: Smoke-test macOS binary
        shell: bash
        env:
          TARGET: aarch64-apple-darwin
        run: "./target/$TARGET/release-fast/wuther-core --version"

  required:
    name: Required CI
    if: always()
    needs:
      - prepare
      - quality
      - linux
      - macos
    runs-on: ubuntu-slim
    timeout-minutes: 5

    steps:
      - name: Verify required jobs
        shell: bash
        env:
          PREPARE_RESULT: ${{ needs.prepare.result }}
          QUALITY_RESULT: ${{ needs.quality.result }}
          LINUX_RESULT: ${{ needs.linux.result }}
          MACOS_RESULT: ${{ needs.macos.result }}
        run: |
          set -euo pipefail
          {
            echo "## Required CI"
            echo
            echo "| Job | Result |"
            echo "| --- | --- |"
            echo "| Resolve inputs | $PREPARE_RESULT |"
            echo "| Formatting and repository checks | $QUALITY_RESULT |"
            echo "| Linux workspace | $LINUX_RESULT |"
            echo "| macOS matrix | $MACOS_RESULT |"
          } >> "$GITHUB_STEP_SUMMARY"

          for result in "$PREPARE_RESULT" "$QUALITY_RESULT" "$LINUX_RESULT"; do
            if [ "$result" != "success" ]; then
              echo "::error::A required CI job did not succeed."
              exit 1
            fi
          done

          if [ "$MACOS_RESULT" != "success" ] && [ "$MACOS_RESULT" != "skipped" ]; then
            echo "::error::The macOS matrix did not succeed."
            exit 1
          fi
