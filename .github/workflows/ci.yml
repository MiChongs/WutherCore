name: CI

on:
  workflow_call:
    inputs:
      ref:
        description: Git ref to validate; defaults to the triggering ref.
        required: false
        type: string
        default: ""
      tags:
        description: Exact component tags; empty validates the standard workspace.
        required: false
        type: string
        default: ""
  pull_request:
    branches: ["main"]
  push:
    branches: ["main"]
  workflow_dispatch:
    inputs:
      tags:
        description: Exact component tags, for example with_quic,with_vless,with_grpc. Empty uses standard.
        required: false
        type: string
        default: ""

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ inputs.ref || github.event.pull_request.number || github.ref }}-${{ inputs.tags || 'standard' }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  CARGO_NET_RETRY: 10
  RUST_BACKTRACE: 1

jobs:
  required-ci:
    name: Required CI
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          ref: ${{ inputs.ref || github.ref }}
          persist-credentials: false

      - name: Check repository presentation
        run: python scripts/check-repository.py

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          components: rustfmt

      - name: Install Firefox Neqo source build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            clang \
            gyp \
            mercurial \
            ninja-build \
            pkg-config

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2.9.1
        with:
          prefix-key: v1-wuther-core
          shared-key: required-ci
          workspaces: |
            . -> target
          cache-bin: false
          cache-on-failure: true
          save-if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}

      - name: Check formatting
        run: cargo fmt --all --check

      - name: Resolve component tags
        shell: bash
        env:
          REQUESTED_TAGS: ${{ inputs.tags }}
        run: |
          set -euo pipefail
          normalized="$(tr ' ;' ',,' <<< "$REQUESTED_TAGS" | sed -E 's/,+/,/g; s/^,//; s/,$//')"
          if [ -n "$normalized" ] && [[ ! "$normalized" =~ ^[A-Za-z0-9_-]+(,[A-Za-z0-9_-]+)*$ ]]; then
            echo "::error::Component tags must be a comma/space-separated list of Cargo feature names."
            exit 1
          fi
          echo "WUTHER_BUILD_TAGS=$normalized" >> "$GITHUB_ENV"

      # Validate every Rust target without repeatedly linking the full workspace.
      # Feature-specific linking and artifact validation belong to their dedicated
      # workflows.
      - name: Check workspace
        shell: bash
        run: |
          if [ -n "$WUTHER_BUILD_TAGS" ]; then
            cargo check -p wuther-core --all-targets --locked \
              --no-default-features --features "$WUTHER_BUILD_TAGS"
          else
            cargo check --workspace --all-targets --locked
          fi
