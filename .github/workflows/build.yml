name: Build Matrix

on:
  workflow_call:
    inputs:
      ref:
        description: Git ref to build; defaults to the triggering ref.
        required: false
        type: string
        default: ""
      version:
        description: Optional version included in archive filenames.
        required: false
        type: string
        default: ""
      tags:
        description: Exact comma-separated component tags; empty uses each target's supported default.
        required: false
        type: string
        default: ""
      platforms:
        description: Platform group to build (all, linux, android, windows, or macos).
        required: false
        type: string
        default: all
      retention-days:
        description: Artifact retention period.
        required: false
        type: number
        default: 1
  workflow_dispatch:
    inputs:
      tags:
        description: Exact component tags, for example with_quic,with_vless,with_grpc. Empty uses target defaults.
        required: false
        type: string
        default: ""
      platforms:
        description: Platform group to compile.
        required: true
        type: choice
        default: all
        options:
          - all
          - linux
          - android
          - windows
          - macos

permissions:
  contents: read

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}-${{ inputs.platforms || 'all' }}-${{ inputs.tags || 'standard' }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  CARGO_NET_RETRY: 10
  CARGO_REGISTRIES_CRATES_IO_PROTOCOL: sparse
  # Minimum supported Android release. NSS and the Rust binary are both built
  # against it; raising it here raises the floor for published Android archives.
  ANDROID_API_LEVEL: "24"

jobs:
  prepare:
    name: Resolve build matrix
    runs-on: ubuntu-slim
    timeout-minutes: 5
    outputs:
      tags: ${{ steps.inputs.outputs.tags }}
      tag-label: ${{ steps.inputs.outputs.tag-label }}
      tag-key: ${{ steps.inputs.outputs.tag-key }}
      platforms: ${{ steps.inputs.outputs.platforms }}
      retention-days: ${{ steps.inputs.outputs.retention-days }}

    steps:
      - name: Validate build inputs
        id: inputs
        shell: bash
        env:
          REQUESTED_TAGS: ${{ inputs.tags }}
          REQUESTED_PLATFORMS: ${{ inputs.platforms || 'all' }}
          REQUESTED_RETENTION: ${{ inputs.retention-days || 1 }}
        run: |
          set -euo pipefail
          normalized="$(tr ' ;' ',,' <<< "$REQUESTED_TAGS" | sed -E 's/,+/,/g; s/^,//; s/,$//')"
          if [ -n "$normalized" ] && [[ ! "$normalized" =~ ^[A-Za-z0-9_-]+(,[A-Za-z0-9_-]+)*$ ]]; then
            echo "::error::Component tags must be a comma/space-separated list of Cargo feature names."
            exit 1
          fi
          if [[ ! "$REQUESTED_PLATFORMS" =~ ^(all|linux|android|windows|macos)$ ]]; then
            echo "::error::Platforms must be all, linux, android, windows, or macos."
            exit 1
          fi

          tag_label="${normalized:-standard (default)}"
          tag_key="standard"
          if [ -n "$normalized" ]; then
            tag_key="$(printf '%s' "$normalized" | sha256sum | cut -c1-16)"
          fi

          echo "tags=$normalized" >> "$GITHUB_OUTPUT"
          echo "tag-label=$tag_label" >> "$GITHUB_OUTPUT"
          echo "tag-key=$tag_key" >> "$GITHUB_OUTPUT"
          echo "platforms=$REQUESTED_PLATFORMS" >> "$GITHUB_OUTPUT"
          echo "retention-days=$REQUESTED_RETENTION" >> "$GITHUB_OUTPUT"
          {
            echo "## Build matrix"
            echo
            echo "- Platforms: \`$REQUESTED_PLATFORMS\`"
            echo "- Components: \`$tag_label\`"
          } >> "$GITHUB_STEP_SUMMARY"

  linux:
    if: needs.prepare.outputs.platforms == 'all' || needs.prepare.outputs.platforms == 'linux'
    needs: prepare
    runs-on: ${{ matrix.platform.runner }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        platform:
          # The musl targets build NSS from source against musl and link it
          # statically, so they stay single static binaries. BoringSSL still
          # has no musl build, which is why their preset is `portable` plus
          # Young rather than `standard`.
          - target: x86_64-unknown-linux-gnu
            name: linux-amd64
            libc: gnu
            runner: ubuntu-24.04
            packages: ""
            default-tags: standard
            young-supported: true
          - target: aarch64-unknown-linux-gnu
            name: linux-arm64
            libc: gnu
            runner: ubuntu-24.04-arm
            packages: ""
            default-tags: standard
            young-supported: true
          - target: x86_64-unknown-linux-musl
            name: linux-amd64-musl
            libc: musl
            runner: ubuntu-24.04
            packages: musl-tools
            default-tags: portable,with_young
            young-supported: true
          - target: aarch64-unknown-linux-musl
            name: linux-arm64-musl
            libc: musl
            runner: ubuntu-24.04-arm
            packages: musl-tools
            default-tags: portable,with_young
            young-supported: true

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          ref: ${{ inputs.ref || github.ref }}
          persist-credentials: false

      - name: Resolve target components
        id: components
        shell: bash
        env:
          DEFAULT_TAGS: ${{ matrix.platform.default-tags }}
          REQUESTED_KEY: ${{ needs.prepare.outputs.tag-key }}
          REQUESTED_TAGS: ${{ needs.prepare.outputs.tags }}
          REQUESTED_LABEL: ${{ needs.prepare.outputs.tag-label }}
          TARGET: ${{ matrix.platform.target }}
          YOUNG_SUPPORTED: ${{ matrix.platform.young-supported }}
        run: bash .github/scripts/resolve-components.sh

      - name: Install target system toolchain
        if: matrix.platform.packages != ''
        shell: bash
        env:
          PACKAGES: ${{ matrix.platform.packages }}
        run: |
          sudo apt-get update
          # The package list is controlled by the static matrix above.
          read -r -a packages <<< "$PACKAGES"
          sudo apt-get install --no-install-recommends -y "${packages[@]}"

      # glibc targets let nss-rs build NSS itself; musl has no such path and
      # gets prebuilt static archives instead.
      - name: Ensure Firefox Neqo build tools
        if: steps.components.outputs.young == 'true' && matrix.platform.libc == 'gnu'
        uses: ./.github/actions/setup-neqo

      - name: Build NSS against musl
        if: steps.components.outputs.young == 'true' && matrix.platform.libc == 'musl'
        uses: ./.github/actions/setup-nss-musl
        with:
          target: ${{ matrix.platform.target }}

      - name: Setup cached Rust
        uses: ./.github/actions/setup-rust
        with:
          cache-key: build-${{ matrix.platform.target }}-${{ steps.components.outputs.key }}
          targets: ${{ matrix.platform.target }}
          cache-targets: true

      - name: Build Linux binary
        shell: bash
        env:
          TARGET: ${{ matrix.platform.target }}
          WUTHER_BUILD_TAGS: ${{ steps.components.outputs.tags }}
        run: |
          set -euo pipefail
          if [ -n "$WUTHER_BUILD_TAGS" ]; then
            cargo build --release --locked --target "$TARGET" \
              -p wuther-core --no-default-features --features "$WUTHER_BUILD_TAGS"
          else
            cargo build --release --locked --target "$TARGET" -p wuther-core
          fi

      # Only the glibc archives ship NSS shared objects. musl links the same
      # libraries statically, so there is nothing to stage beside the binary.
      - name: Stage Linux runtime libraries
        if: steps.components.outputs.young == 'true' && matrix.platform.libc == 'gnu'
        shell: bash
        env:
          TARGET: ${{ matrix.platform.target }}
        run: >-
          python3 scripts/stage-runtime-libraries.py
          --target "$TARGET"
          --require libnssutil3.so

      - name: Smoke-test native Linux binary
        if: steps.components.outputs.young == 'true'
        shell: bash
        env:
          TARGET: ${{ matrix.platform.target }}
          LIBC: ${{ matrix.platform.libc }}
        run: |
          set -euo pipefail
          binary="./target/$TARGET/release/wuther-core"
          "$binary" --version
          "$binary" components | tee components.txt
          grep -q 'with_young' components.txt
          rm -f components.txt

          # The musl archives are published as standalone static binaries;
          # catch a dynamic NSS creeping in here rather than on a user's box.
          if [ "$LIBC" = "musl" ] && ldd "$binary" 2>&1 | grep -q 'libnss\|libnspr\|libssl3'; then
            echo "::error::musl binary links NSS dynamically"
            ldd "$binary" || true
            exit 1
          fi

      - name: Package artifact
        id: package
        env:
          TARGET: ${{ matrix.platform.target }}
          PLATFORM_NAME: ${{ matrix.platform.name }}
          RELEASE_VERSION: ${{ inputs.version }}
          WUTHER_BUILD_TAG_LABEL: ${{ steps.components.outputs.label }}
        run: >-
          python scripts/package-artifact.py
          --target "$TARGET"
          --platform "$PLATFORM_NAME"
          --version "$RELEASE_VERSION"
          --tags "$WUTHER_BUILD_TAG_LABEL"

      - name: Upload artifact
        uses: actions/upload-artifact@v7.0.1
        with:
          name: ${{ steps.package.outputs.name }}
          path: ${{ steps.package.outputs.archive }}
          if-no-files-found: error
          archive: false
          overwrite: true
          retention-days: ${{ needs.prepare.outputs.retention-days }}

  android:
    if: needs.prepare.outputs.platforms == 'all' || needs.prepare.outputs.platforms == 'android'
    needs: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        platform:
          # NSS is cross-compiled statically for Android, so these archives stay
          # single self-contained binaries. BoringSSL still has no Android cross
          # build, which is why the preset is `portable` plus Young rather than
          # `standard`.
          - target: aarch64-linux-android
            ndk-target: arm64-v8a
            name: android-arm64
            default-tags: portable,with_young
            young-supported: true
          - target: armv7-linux-androideabi
            ndk-target: armeabi-v7a
            name: android-arm
            default-tags: portable,with_young
            young-supported: true

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          ref: ${{ inputs.ref || github.ref }}
          persist-credentials: false

      - name: Resolve target components
        id: components
        shell: bash
        env:
          DEFAULT_TAGS: ${{ matrix.platform.default-tags }}
          REQUESTED_KEY: ${{ needs.prepare.outputs.tag-key }}
          REQUESTED_TAGS: ${{ needs.prepare.outputs.tags }}
          REQUESTED_LABEL: ${{ needs.prepare.outputs.tag-label }}
          TARGET: ${{ matrix.platform.target }}
          YOUNG_SUPPORTED: ${{ matrix.platform.young-supported }}
        run: bash .github/scripts/resolve-components.sh

      - name: Setup cached Rust
        uses: ./.github/actions/setup-rust
        with:
          cache-key: build-${{ matrix.platform.target }}-${{ steps.components.outputs.key }}
          targets: ${{ matrix.platform.target }}
          cache-targets: true

      - name: Setup Android NDK
        id: ndk
        uses: nttld/setup-ndk@v1.6.0
        with:
          ndk-version: r29
          add-to-path: true
          local-cache: true

      - name: Install cargo-ndk
        uses: taiki-e/install-action@v2.85.2
        with:
          tool: cargo-ndk@4.1.2

      # NSS and the Rust binary must agree on the Android API level, otherwise
      # the static archives reference bionic symbols the linker resolves against
      # a different set of stubs. Both sides read ANDROID_API_LEVEL below.
      - name: Cross-compile NSS for Android
        if: steps.components.outputs.young == 'true'
        uses: ./.github/actions/setup-nss-android
        with:
          target: ${{ matrix.platform.target }}
          api-level: ${{ env.ANDROID_API_LEVEL }}
          ndk-home: ${{ steps.ndk.outputs.ndk-path }}

      - name: Build Android binary
        shell: bash
        env:
          NDK_TARGET: ${{ matrix.platform.ndk-target }}
          TARGET: ${{ matrix.platform.target }}
          WUTHER_BUILD_TAGS: ${{ steps.components.outputs.tags }}
        run: |
          set -euo pipefail
          if [ -n "$WUTHER_BUILD_TAGS" ]; then
            cargo ndk --target "$NDK_TARGET" --platform "$ANDROID_API_LEVEL" \
              build --release --locked -p wuther-core \
              --no-default-features --features "$WUTHER_BUILD_TAGS"
          else
            cargo ndk --target "$NDK_TARGET" --platform "$ANDROID_API_LEVEL" \
              build --release --locked -p wuther-core
          fi

      - name: Package artifact
        id: package
        env:
          TARGET: ${{ matrix.platform.target }}
          PLATFORM_NAME: ${{ matrix.platform.name }}
          RELEASE_VERSION: ${{ inputs.version }}
          WUTHER_BUILD_TAG_LABEL: ${{ steps.components.outputs.label }}
        run: >-
          python scripts/package-artifact.py
          --target "$TARGET"
          --platform "$PLATFORM_NAME"
          --version "$RELEASE_VERSION"
          --tags "$WUTHER_BUILD_TAG_LABEL"

      - name: Upload artifact
        uses: actions/upload-artifact@v7.0.1
        with:
          name: ${{ steps.package.outputs.name }}
          path: ${{ steps.package.outputs.archive }}
          if-no-files-found: error
          archive: false
          overwrite: true
          retention-days: ${{ needs.prepare.outputs.retention-days }}

  windows:
    if: needs.prepare.outputs.platforms == 'all' || needs.prepare.outputs.platforms == 'windows'
    needs: prepare
    runs-on: ${{ matrix.platform.runner }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        platform:
          # nss-rs links NSS statically on Windows, so Young adds no runtime
          # dependency to the archive. ARM64 stays on `portable`: the
          # windows-11-arm image ships no MSYS2, and NSS has no native ARM64
          # Windows build chain, so its NSS toolchain cannot be provisioned.
          - target: x86_64-pc-windows-msvc
            name: windows-amd64-msvc
            runner: windows-2025
            default-tags: portable,with_young
            young-supported: true
          - target: aarch64-pc-windows-msvc
            name: windows-arm64-msvc
            runner: windows-11-arm
            default-tags: portable
            young-supported: false

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          ref: ${{ inputs.ref || github.ref }}
          persist-credentials: false

      - name: Resolve target components
        id: components
        shell: bash
        env:
          DEFAULT_TAGS: ${{ matrix.platform.default-tags }}
          REQUESTED_KEY: ${{ needs.prepare.outputs.tag-key }}
          REQUESTED_TAGS: ${{ needs.prepare.outputs.tags }}
          REQUESTED_LABEL: ${{ needs.prepare.outputs.tag-label }}
          TARGET: ${{ matrix.platform.target }}
          YOUNG_SUPPORTED: ${{ matrix.platform.young-supported }}
        run: bash .github/scripts/resolve-components.sh

      - name: Setup cached Rust
        uses: ./.github/actions/setup-rust
        with:
          cache-key: build-${{ matrix.platform.target }}-${{ steps.components.outputs.key }}
          targets: ${{ matrix.platform.target }}
          cache-targets: true

      - name: Ensure Firefox Neqo build tools
        if: steps.components.outputs.young == 'true'
        uses: ./.github/actions/setup-neqo

      - name: Build Windows binary
        shell: bash
        env:
          TARGET: ${{ matrix.platform.target }}
          WUTHER_BUILD_TAGS: ${{ steps.components.outputs.tags }}
        run: |
          set -euo pipefail
          if [ -n "$WUTHER_BUILD_TAGS" ]; then
            cargo build --release --locked --target "$TARGET" \
              -p wuther-core --no-default-features --features "$WUTHER_BUILD_TAGS"
          else
            cargo build --release --locked --target "$TARGET" -p wuther-core
          fi

      - name: Smoke-test Windows binary
        shell: pwsh
        env:
          TARGET: ${{ matrix.platform.target }}
          EXPECT_YOUNG: ${{ steps.components.outputs.young }}
        run: |
          $ErrorActionPreference = 'Stop'
          # Drop the NSS build tree and MSYS2 from PATH first. nss-rs links NSS
          # statically on Windows, so the archive ships no NSS DLLs; running with
          # those directories still on PATH would hide an accidental dynamic link
          # here and only break on the user's machine.
          $env:PATH = ($env:PATH -split ';' | Where-Object {
            $_ -and $_ -notmatch 'msys64' -and $_ -notmatch 'dist[\\/]Release[\\/]lib'
          }) -join ';'

          $binary = "target/$env:TARGET/release/wuther-core.exe"
          & $binary --version
          if ($LASTEXITCODE -ne 0) { throw "wuther-core --version failed" }

          if ($env:EXPECT_YOUNG -eq 'true') {
            $components = & $binary components
            if ($LASTEXITCODE -ne 0) { throw "wuther-core components failed" }
            Write-Output "components: $components"
            if ($components -notmatch 'with_young') {
              throw "with_young is missing from the $env:TARGET build"
            }
          }

      - name: Package artifact
        id: package
        shell: pwsh
        env:
          TARGET: ${{ matrix.platform.target }}
          PLATFORM_NAME: ${{ matrix.platform.name }}
          RELEASE_VERSION: ${{ inputs.version }}
          WUTHER_BUILD_TAG_LABEL: ${{ steps.components.outputs.label }}
        run: |
          python scripts/package-artifact.py `
            --target "$env:TARGET" `
            --platform "$env:PLATFORM_NAME" `
            --version "$env:RELEASE_VERSION" `
            --tags "$env:WUTHER_BUILD_TAG_LABEL"

      - name: Upload artifact
        uses: actions/upload-artifact@v7.0.1
        with:
          name: ${{ steps.package.outputs.name }}
          path: ${{ steps.package.outputs.archive }}
          if-no-files-found: error
          archive: false
          overwrite: true
          retention-days: ${{ needs.prepare.outputs.retention-days }}

  macos:
    name: macOS Apple Silicon
    if: needs.prepare.outputs.platforms == 'all' || needs.prepare.outputs.platforms == 'macos'
    needs: prepare
    runs-on: macos-15
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          ref: ${{ inputs.ref || github.ref }}
          persist-credentials: false

      - name: Resolve target components
        id: components
        shell: bash
        env:
          DEFAULT_TAGS: standard
          REQUESTED_KEY: ${{ needs.prepare.outputs.tag-key }}
          REQUESTED_TAGS: ${{ needs.prepare.outputs.tags }}
          REQUESTED_LABEL: ${{ needs.prepare.outputs.tag-label }}
          TARGET: aarch64-apple-darwin
          YOUNG_SUPPORTED: true
        run: bash .github/scripts/resolve-components.sh

      - name: Setup cached Rust
        uses: ./.github/actions/setup-rust
        with:
          cache-key: build-aarch64-apple-darwin-${{ steps.components.outputs.key }}
          targets: aarch64-apple-darwin
          cache-targets: true

      - name: Ensure Firefox Neqo build tools
        if: steps.components.outputs.young == 'true'
        uses: ./.github/actions/setup-neqo

      - name: Build macOS binary
        shell: bash
        env:
          TARGET: aarch64-apple-darwin
          WUTHER_BUILD_TAGS: ${{ steps.components.outputs.tags }}
        run: |
          set -euo pipefail
          if [ -n "$WUTHER_BUILD_TAGS" ]; then
            cargo build --release --locked --target "$TARGET" \
              -p wuther-core --no-default-features --features "$WUTHER_BUILD_TAGS"
          else
            cargo build --release --locked --target "$TARGET" -p wuther-core
          fi

      - name: Stage macOS runtime libraries
        if: steps.components.outputs.young == 'true'
        shell: bash
        env:
          TARGET: aarch64-apple-darwin
        run: >-
          python3 scripts/stage-runtime-libraries.py
          --target "$TARGET"
          --require libnssutil3.dylib

      - name: Smoke-test macOS binary
        shell: bash
        env:
          TARGET: aarch64-apple-darwin
          EXPECT_YOUNG: ${{ steps.components.outputs.young }}
        run: |
          set -euo pipefail
          binary="./target/$TARGET/release/wuther-core"
          "$binary" --version
          if [ "$EXPECT_YOUNG" = "true" ]; then
            "$binary" components | tee components.txt
            grep -q 'with_young' components.txt
            rm -f components.txt
          fi

      - name: Package artifact
        id: package
        env:
          TARGET: aarch64-apple-darwin
          PLATFORM_NAME: macos-arm64
          RELEASE_VERSION: ${{ inputs.version }}
          WUTHER_BUILD_TAG_LABEL: ${{ steps.components.outputs.label }}
        run: >-
          python3 scripts/package-artifact.py
          --target "$TARGET"
          --platform "$PLATFORM_NAME"
          --version "$RELEASE_VERSION"
          --tags "$WUTHER_BUILD_TAG_LABEL"

      - name: Upload artifact
        uses: actions/upload-artifact@v7.0.1
        with:
          name: ${{ steps.package.outputs.name }}
          path: ${{ steps.package.outputs.archive }}
          if-no-files-found: error
          archive: false
          overwrite: true
          retention-days: ${{ needs.prepare.outputs.retention-days }}

  complete:
    name: Build matrix complete
    if: always()
    needs:
      - prepare
      - linux
      - android
      - windows
      - macos
    runs-on: ubuntu-slim
    timeout-minutes: 5

    steps:
      - name: Verify selected platform jobs
        shell: bash
        env:
          PREPARE_RESULT: ${{ needs.prepare.result }}
          LINUX_RESULT: ${{ needs.linux.result }}
          ANDROID_RESULT: ${{ needs.android.result }}
          WINDOWS_RESULT: ${{ needs.windows.result }}
          MACOS_RESULT: ${{ needs.macos.result }}
        run: |
          set -euo pipefail
          {
            echo "## Build matrix result"
            echo
            echo "| Platform | Result |"
            echo "| --- | --- |"
            echo "| Linux | $LINUX_RESULT |"
            echo "| Android | $ANDROID_RESULT |"
            echo "| Windows | $WINDOWS_RESULT |"
            echo "| macOS | $MACOS_RESULT |"
          } >> "$GITHUB_STEP_SUMMARY"

          for result in \
            "$PREPARE_RESULT" "$LINUX_RESULT" "$ANDROID_RESULT" \
            "$WINDOWS_RESULT" "$MACOS_RESULT"; do
            if [ "$result" != "success" ] && [ "$result" != "skipped" ]; then
              echo "::error::A selected build job did not succeed."
              exit 1
            fi
          done
