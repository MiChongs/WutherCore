name: Setup Firefox Neqo build tools
description: Provide the NSS toolchain nss-rs needs on the current runner image.

inputs:
  nss-minimum-version:
    description: Minimum NSS release accepted by nss-rs; keep in sync with its min_version.txt.
    required: false
    default: "3.121"

runs:
  using: composite
  steps:
    - name: Ensure Linux tools
      if: runner.os == 'Linux'
      shell: bash
      run: |
        set -euo pipefail
        declare -A packages=(
          [clang]=clang
          [gyp]=gyp
          [hg]=mercurial
          [ninja]=ninja-build
          [pkg-config]=pkg-config
        )
        missing=()
        for command in "${!packages[@]}"; do
          command -v "$command" >/dev/null 2>&1 || missing+=("${packages[$command]}")
        done
        if ((${#missing[@]})); then
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y "${missing[@]}"
        fi

    - name: Ensure macOS tools
      if: runner.os == 'macOS'
      shell: bash
      run: |
        set -euo pipefail
        if ! command -v gyp >/dev/null 2>&1; then
          gyp_venv="$RUNNER_TEMP/gyp-next"
          python3 -m venv "$gyp_venv"
          "$gyp_venv/bin/python" -m pip install \
            --disable-pip-version-check --no-input "gyp-next==0.22.2"
          echo "$gyp_venv/bin" >> "$GITHUB_PATH"
        fi
        if ! command -v hg >/dev/null 2>&1; then
          brew install mercurial
        fi
        if ! command -v ninja >/dev/null 2>&1; then
          brew install ninja
        fi

    # Windows cannot use the same approach as Linux and macOS. There, nss-rs
    # clones NSS itself and runs its build.sh; on Windows that script additionally
    # needs an activated MSVC environment and MSYS tooling, and NSPR does not
    # produce usable shared libraries, so nss-rs links NSS statically instead.
    # Mozilla's own action provisions a pinned NSS release plus that environment
    # and exports NSS_DIR/NSS_PREBUILT, which makes nss-rs consume the prepared
    # tree rather than build one. It is the same action neqo's CI uses.
    - name: Provision NSS (Windows)
      if: runner.os == 'Windows'
      uses: mozilla/actions/nss@c7f9db3409fff64a55f16ac0cacbc4cdd05ae435 # v1.1.19
      with:
        minimum-version: ${{ inputs.nss-minimum-version }}

    # nss-rs only derives LIBCLANG_PATH from a gecko checkout, and otherwise
    # leaves bindgen to find libclang on its own. Pin it to the runner's LLVM so
    # a missing libclang fails here with a clear message instead of surfacing as
    # an opaque bindgen error part-way through the build.
    - name: Expose libclang (Windows)
      if: runner.os == 'Windows'
      shell: pwsh
      run: |
        $ErrorActionPreference = 'Stop'
        if ($env:LIBCLANG_PATH) {
          Write-Output "LIBCLANG_PATH already set to $env:LIBCLANG_PATH"
          exit 0
        }
        $candidates = @(
          (Join-Path $env:ProgramFiles 'LLVM\bin'),
          (Join-Path ${env:ProgramFiles(x86)} 'LLVM\bin')
        )
        $found = $candidates |
          Where-Object { $_ -and (Test-Path (Join-Path $_ 'libclang.dll')) } |
          Select-Object -First 1
        if (-not $found) {
          throw "libclang.dll not found in $($candidates -join ', '); bindgen cannot generate NSS bindings."
        }
        Write-Output "Using libclang from $found"
        "LIBCLANG_PATH=$found" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
